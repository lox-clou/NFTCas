<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VANTA Casino — see.tg</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">◆ VANTA</div>
    <div class="balance">
      <span class="ton-icon">◈</span>
      <span id="balance">0.00</span> TON
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="games">Игры</button>
    <button class="tab" data-view="nft">NFT</button>
    <button class="tab" data-view="profile">Профиль</button>
  </nav>

  <main class="view" id="view">
    <!-- GAMES -->
    <section class="panel" data-panel="games">
      <div class="game-grid">
        <div class="game-card" data-game="coin">
          <div class="emoji">🪙</div>
          <h3>Coin Flip</h3>
          <p>x2 · орёл или решка</p>
        </div>
        <div class="game-card" data-game="dice">
          <div class="emoji">🎲</div>
          <h3>Dice</h3>
          <p>угадай число · до x6</p>
        </div>
        <div class="game-card" data-game="slots">
          <div class="emoji">🎰</div>
          <h3>Slots</h3>
          <p>три барабана</p>
        </div>
        <div class="game-card" data-game="crash">
          <div class="emoji">📈</div>
          <h3>Crash</h3>
          <p>забери до краха</p>
        </div>
      </div>

      <div class="arena" id="arena">
        <div class="arena-empty">выбери игру ↑</div>
      </div>
    </section>

    <!-- NFT -->
    <section class="panel hidden" data-panel="nft">
      <h2 class="section-title">NFT коллекция</h2>
      <div class="nft-grid" id="nftGrid"></div>
      <h2 class="section-title">Мои NFT</h2>
      <div class="nft-grid" id="myNft"></div>
    </section>

    <!-- PROFILE -->
    <section class="panel hidden" data-panel="profile">
      <div class="profile-card">
        <div class="avatar" id="avatar">?</div>
        <div class="name" id="userName">гость</div>
        <div class="stat"><span>TON баланс</span><b id="pBal">0.00</b></div>
        <div class="stat"><span>Игр сыграно</span><b id="pGames">0</b></div>
        <div class="stat"><span>Выиграно</span><b id="pWins">0</b></div>
        <div class="stat"><span>NFT в коллекции</span><b id="pNft">0</b></div>
      </div>
      <button class="btn ghost" id="depositBtn">+ Пополнить (демо)</button>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
